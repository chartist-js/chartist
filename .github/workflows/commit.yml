name: Commit

# Conventional commit messages drive the version and the changelog of a
# release, so pushed commits are linted against .commitlintrc.json.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
