<!DOCTYPE html>
<html>
  <head>
    <script type="module" src="/dist/index.js"></script>
    <script  type="module" src="./index.js"></script>
    <style>
        .ct-grid {
          stroke: black;
          stroke-width: 1px;
          fill: none;
        }
        .ct-line {
          stroke: red;
          stroke-width: 2px;
          fill: none;
        }
        .ct-label.ct-radial {
          transform: translate(-100%, -100%) translate(-4px,-4px);
          position: absolute;
        }

        .ct-label.ct-angular {
          transform: translate(-50%, -50%);
          position: absolute;
        }
    </style>
  </head>
  <body>
    <div id="chart" style="width: 640px; height: 640px; position:relative; background-color: #e0e0e0;"></div>
  </body>
</html>
