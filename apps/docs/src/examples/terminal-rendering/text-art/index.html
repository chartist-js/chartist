<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text art</title>
  </head>
  <body>
    <div class="window">
      <div class="title-bar" aria-hidden="true">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="title">ct-cli</span>
      </div>
      <div class="screen">
        <p class="prompt" aria-hidden="true">
          <span class="sigil">$</span>
          <span class="arg">ct-cli</span>
          <span class="arg">line</span>
          <span class="arg">12,9,7,8,5</span>
          <span class="arg">2,1,3.5,7,3</span>
          <span class="arg">-l Mon,Tue,Wed,Thu,Fri</span>
          <span class="arg">--low 0</span>
          <span class="arg">--area</span>
          <span class="arg">--smooth</span>
        </p>
        <div id="art"></div>
        <p class="prompt" aria-hidden="true">
          <span class="sigil">$</span> <span class="cursor"></span>
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
