<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Importing chartist/compat sets up the global Chartist that plugin
         scripts read. The deferred plugin script runs after it, before
         main.ts. Here the names load the site's copies. -->
    <script type="module">
      import 'chartist/compat';
    </script>
    <script defer src="chartist-plugin-axistitle"></script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="chart" class="ct-golden-section"></div>
  </body>
</html>
